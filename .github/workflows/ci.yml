name: CI

'on':
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Dead code (knip)
        run: npm run knip

      - name: Coverage
        run: npm run coverage

      - name: Integration tests
        run: npm run test:integration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  lint-and-test:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Verify CI matrix
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "CI matrix result: ${{ needs.test.result }}"
            exit 1
          fi
