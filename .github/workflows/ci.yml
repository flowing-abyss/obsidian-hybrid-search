name: CI

'on':
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: CI (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm install --global npm@12.2.0
      - name: Cache npm packages
        uses: actions/setup-node@v6
        with:
          cache: npm
      - run: npm ci
      - name: Restore model downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: local-models-e5-small-gte-int8-${{ runner.os }}-v1
      - name: Complete platform checks
        run: npm run verify:ci

  quality:
    # Quantized ONNX output varies by CPU architecture; keep the reference on ARM64.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global npm@12.2.0
      - name: Cache npm packages
        uses: actions/setup-node@v6
        with:
          cache: npm
      - run: npm ci
      - name: Restore model downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: local-models-e5-small-gte-int8-${{ runner.os }}-v1
      - run: npm run verify:quality
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fresh-ranking-results
          path: eval/results/.tmp-quality-*.json
          include-hidden-files: true
          if-no-files-found: warn

  lint-and-test:
    runs-on: ubuntu-latest
    needs: [test, quality]
    if: always()
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify every required job
        run: node scripts/check-ci-results.mjs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
