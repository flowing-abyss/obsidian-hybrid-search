name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read # needed to verify CI status before publishing
      contents: write # needed to create GitHub Release
      id-token: write # needed for OIDC npm publish

    steps:
      - uses: actions/checkout@v6

      - name: Wait for CI to pass for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            run_json="$(gh run list \
              --workflow CI \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json databaseId,status,conclusion,url)"

            run_count="$(jq 'length' <<<"$run_json")"
            if [ "$run_count" -eq 0 ]; then
              echo "No CI run registered yet for $GITHUB_SHA. Waiting..."
              sleep 20
              continue
            fi

            status="$(jq -r '.[0].status' <<<"$run_json")"
            conclusion="$(jq -r '.[0].conclusion' <<<"$run_json")"
            url="$(jq -r '.[0].url' <<<"$run_json")"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Verified CI success for commit $GITHUB_SHA: $url"
                exit 0
              fi
              echo "CI failed for commit $GITHUB_SHA."
              echo "Conclusion: $conclusion"
              echo "Run: $url"
              exit 1
            fi

            echo "CI is $status for $GITHUB_SHA ($url). Waiting..."
            sleep 20
          done

          echo "Timed out waiting for CI on $GITHUB_SHA."
          exit 1

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Synchronize server.json version
        run: npm run sync-server-json

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
