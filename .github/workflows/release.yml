name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_call:
    inputs:
      release_tag:
        description: Existing release tag to publish or recover (for example, v0.16.2)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish or recover (for example, v0.16.2)
        required: true
        type: string

# Shared across tag pushes, the automatic caller, and explicit recovery.
concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write

    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      # Older tags may not contain these helpers. Keep the trusted workflow's
      # tools outside the package checkout so recovery works for those tags too.
      - name: Preserve trusted release tools
        run: |
          mkdir -p "$RUNNER_TEMP/release-tools"
          cp scripts/release-guard.mjs scripts/publish-release-npm.mjs scripts/publish-release-mcp.mjs "$RUNNER_TEMP/release-tools/"

      - name: Verify release tag and trusted CI
        id: release-tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node "$RUNNER_TEMP/release-tools/release-guard.mjs" verify

      - name: Checkout verified release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release-tag.outputs.commit_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish npm package and wait for registry visibility
        run: node "$RUNNER_TEMP/release-tools/publish-release-npm.mjs"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        run: |
          curl --fail --silent --show-error --location "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        run: node "$RUNNER_TEMP/release-tools/publish-release-mcp.mjs"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: ${{ steps.release-tag.outputs.release_tag }}
