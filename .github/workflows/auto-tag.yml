name: Auto-tag after dependency update merge

on:
  push:
    branches: [master]

jobs:
  tag:
    # Only run when the dependency update PR is squash-merged into master.
    # Depending on the merge path, the squash commit subject may come from
    # either the PR title or the head commit message.
    if: "startsWith(github.event.head_commit.message, 'chore: weekly dependency update') || startsWith(github.event.head_commit.message, 'chore: update dependencies')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.DEPENDENCY_UPDATE_TOKEN }}

      - name: Verify version was bumped relative to previous commit
        run: |
          PREV=$(git show HEAD~1:package.json | jq -r .version)
          CURR=$(jq -r .version package.json)
          if [ "$PREV" = "$CURR" ]; then
            echo "ERROR: package.json version was not bumped (still $CURR). Aborting tag creation."
            exit 1
          fi
          echo "Version bumped: $PREV → $CURR ✅"

      - name: Verify server.json is synchronized with package.json
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          SERVER_VERSION=$(jq -r .version server.json)
          SERVER_PKG_VERSION=$(jq -r '.packages[0].version // empty' server.json)
          if [ "$SERVER_VERSION" != "$PKG_VERSION" ] || [ "$SERVER_PKG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: server.json is out of sync with package.json ($SERVER_VERSION / $SERVER_PKG_VERSION vs $PKG_VERSION). Aborting tag creation."
            exit 1
          fi
          echo "server.json is synchronized with package.json ✅"

      - name: Read version from package.json
        id: version
        run: echo "version=v$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          TAG="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-parse "$TAG")
            HEAD_COMMIT=$(git rev-parse HEAD)
            if [ "$TAG_COMMIT" = "$HEAD_COMMIT" ]; then
              echo "Tag $TAG already points to HEAD, skipping."
              exit 0
            fi
            echo "Tag $TAG exists on $TAG_COMMIT but HEAD is $HEAD_COMMIT. Moving tag to HEAD."
            git push origin ":refs/tags/$TAG"
          fi

          git tag "$TAG"
          git push origin "$TAG"
          echo "Pushed tag $TAG ✅"
