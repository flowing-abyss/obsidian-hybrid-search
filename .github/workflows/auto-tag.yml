name: Auto-tag after dependency update merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      commit_sha: ${{ steps.tag.outputs.commit_sha }}
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Preserve trusted release guard
        run: |
          mkdir -p "$RUNNER_TEMP/release-tools"
          cp scripts/release-guard.mjs "$RUNNER_TEMP/release-tools/"

      - name: Validate completed CI and dependency PR
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/release-tools/release-guard.mjs" candidate

      - name: Checkout release candidate
        if: steps.candidate.outputs.candidate_sha != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.candidate.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Validate versions and create or verify immutable tag
        if: steps.candidate.outputs.candidate_sha != ''
        id: tag
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: node "$RUNNER_TEMP/release-tools/release-guard.mjs" tag

  publish:
    needs: prepare
    if: needs.prepare.outputs.release_tag != ''
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.prepare.outputs.release_tag }}
    secrets: inherit
