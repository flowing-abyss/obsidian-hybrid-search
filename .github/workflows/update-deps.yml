name: Weekly Dependency Update

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at 00:00 UTC
  workflow_dispatch:

concurrency:
  group: weekly-dependency-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-deps:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'

    steps:
      - name: Check release App configuration
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$RELEASE_APP_CLIENT_ID" ] || [ -z "$RELEASE_APP_PRIVATE_KEY" ]; then
            echo 'Configure repository variable RELEASE_APP_CLIENT_ID and secret RELEASE_APP_PRIVATE_KEY, and install the release App on this repository with Contents and Pull requests write permissions.'
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: master

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # npm 10's arborist fails on this dependency peer graph; npm 12 resolves it.
      - name: Install npm 12
        run: npm install -g npm@12

      - name: Install dependencies
        run: npm ci

      - name: Update dependencies
        run: npm update --save

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet package.json package-lock.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Bump patch version
        if: steps.changes.outputs.changed == 'true'
        id: bump
        run: |
          npm version patch --no-git-tag-version
          npm run sync-server-json
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Format generated files
        if: steps.changes.outputs.changed == 'true'
        run: npm run format

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Lint
        if: steps.changes.outputs.changed == 'true'
        run: npm run lint

      - name: Unit tests
        if: steps.changes.outputs.changed == 'true'
        run: npm test

      - name: Dead code
        if: steps.changes.outputs.changed == 'true'
        run: npm run knip

      - name: Create release App token
        if: steps.changes.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore: update dependencies'
          branch: chore/update-deps
          base: master
          add-paths: |
            package.json
            package-lock.json
            server.json
          title: 'chore: weekly dependency update'
          body: |
            Automated weekly dependency update.

            - Ran `npm update --save` within the existing semver ranges.
            - Bumped the patch version to `${{ steps.bump.outputs.version }}` and synchronized all release manifests.
            - Formatting, build, lint, unit tests, and knip passed.
            - Native CI and the required `lint-and-test` check gate auto-merge.
          labels: dependencies

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --delete-branch --match-head-commit "$PR_HEAD_SHA"

      - name: Summarize dependency update
        if: always()
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          if [ -n "$PR_URL" ]; then
            printf 'Dependency update: %s\n\nPatch version: `%s`\n' "$PR_URL" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No dependency update PR was created. See the steps above for unchanged dependencies or validation errors.' >> "$GITHUB_STEP_SUMMARY"
          fi
