name: Weekly Dependency Update

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  update-deps:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    env:
      HUSKY: '0'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update dependencies
        run: npm update --save

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet package.json package-lock.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Bump patch version
        if: steps.changes.outputs.changed == 'true'
        id: bump
        run: |
          npm version patch --no-git-tag-version
          npm run sync-server-json
          echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Format generated files
        if: steps.changes.outputs.changed == 'true'
        run: npm run format

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Lint
        if: steps.changes.outputs.changed == 'true'
        run: npm run lint

      - name: Unit tests
        if: steps.changes.outputs.changed == 'true'
        run: npm test

      - name: Dead code
        if: steps.changes.outputs.changed == 'true'
        run: npm run knip

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: update dependencies'
          branch: chore/update-deps
          title: 'chore: weekly dependency update'
          body: |
            Automated weekly dependency update.

            - `npm update --save` was run to update all dependencies within their semver ranges
            - Version bumped to `${{ steps.bump.outputs.version }}`
            - Formatting, lint, build, unit tests, and knip passed ✅
          labels: dependencies

      - name: Run CI for pull request branch
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ steps.pr.outputs.pull-request-branch }}"

      - name: Mark required CI status pending
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${PR_HEAD_SHA}" \
            -f state=pending \
            -f context=lint-and-test \
            -f description="CI is running for dependency update" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Wait for CI and publish required status
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.pr.outputs.pull-request-branch }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          publish_status() {
            local state="$1"
            local description="$2"
            local target_url="$3"

            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${PR_HEAD_SHA}" \
              -f state="$state" \
              -f context=lint-and-test \
              -f description="$description" \
              -f target_url="$target_url"
          }

          for i in $(seq 1 90); do
            run_json="$(gh run list \
              --workflow CI \
              --branch "$PR_BRANCH" \
              --commit "$PR_HEAD_SHA" \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId,status,conclusion,url)"

            run_count="$(jq 'length' <<<"$run_json")"
            if [ "$run_count" -eq 0 ]; then
              echo "No dispatched CI run registered yet for $PR_BRANCH at $PR_HEAD_SHA. Waiting..."
              sleep 20
              continue
            fi

            status="$(jq -r '.[0].status' <<<"$run_json")"
            conclusion="$(jq -r '.[0].conclusion' <<<"$run_json")"
            url="$(jq -r '.[0].url' <<<"$run_json")"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI passed for $PR_BRANCH at $PR_HEAD_SHA: $url"
                publish_status success "CI passed for dependency update" "$url"
                exit 0
              fi
              echo "CI failed for $PR_BRANCH at $PR_HEAD_SHA."
              echo "Conclusion: $conclusion"
              echo "Run: $url"
              publish_status failure "CI failed for dependency update" "$url"
              exit 1
            fi

            echo "CI is $status for $PR_BRANCH at $PR_HEAD_SHA ($url). Waiting..."
            sleep 20
          done

          echo "Timed out waiting for CI on $PR_BRANCH at $PR_HEAD_SHA."
          publish_status failure "Timed out waiting for dependency CI" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          exit 1

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number
        run: gh pr merge --auto --squash --delete-branch ${{ steps.pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ github.token }}
